<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rimba Nusantara</title>
<style>
html,body{height:100%;margin:0;background:#0e0c08;color:#f3ead6;font-family:Georgia,"Times New Roman",serif;overflow:hidden}
#game{position:fixed;inset:0;width:100%;height:100%;display:none;touch-action:none}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
 background:radial-gradient(ellipse at 50% 35%,#24351f 0%,#0e0c08 70%);transition:opacity .8s}
#load.hide{opacity:0;pointer-events:none}
.leaf{font-size:56px;animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
h1{margin:.2em 0 0;font-size:2.2rem;letter-spacing:.06em;color:#e0b64a}
.sub{margin:.2em 0 28px;color:#c9bb98;font-style:italic}
.bar{width:min(340px,80vw);height:10px;border:1px solid rgba(224,182,74,.5);border-radius:6px;overflow:hidden;background:rgba(0,0,0,.4)}
#fill{height:100%;width:0;background:linear-gradient(90deg,#8c6a1a,#e0b64a);transition:width .35s}
#status{margin-top:12px;min-height:1.4em;color:#e8dcb8;font-size:.95rem}
#tip{margin-top:26px;max-width:380px;color:#a89d80;font-size:.85rem;min-height:3em}
#go{display:none;margin-top:22px;font:600 1rem system-ui,sans-serif;background:#e0b64a;color:#1b150a;border:0;border-radius:9px;padding:12px 26px;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="load">
  <div class="leaf">🌿</div>
  <h1>RIMBA NUSANTARA</h1>
  <p class="sub">Ekspedisi berburu di hutan purba</p>
  <div class="bar"><div id="fill"></div></div>
  <div id="status">Menyiapkan bekal…</div>
  <div id="tip"></div>
  <button id="go">Masuk Hutan</button>
</div>

<script src="map.js"></script>
<script>
var tips=[
 "Lari dengan Shift menguras tenaga. Tanpa tenaga, langkahmu melambat.",
 "Lapar dan haus menggerogoti nyawa. Minum di tepi sungai dan panggang daging buruanmu dengan tombol E.",
 "Gigitan harimau menimbulkan luka berdarah. Diamlah sekitar lima detik untuk membalutnya dengan kain.",
 "Tanpa kompas: baca arah dari matahari di siang hari dan Gubuk Penceng (rasi di selatan) di malam hari.",
 "Hujan membuat tanah licin, sedangkan malam mempersempit pandangan dan membuat harimau lebih berani."
];
var tipEl=document.getElementById("tip"),ti=0;
function nextTip(){tipEl.textContent="Petunjuk: "+tips[ti++%tips.length]}
nextTip();setInterval(nextTip,3200);

ForestMap.generate(function(p,label){
  document.getElementById("fill").style.width=Math.round(p*100)+"%";
  document.getElementById("status").textContent=label;
},function(){
  var b=document.getElementById("go");b.style.display="inline-block";
  b.onclick=function(){
    document.getElementById("load").classList.add("hide");
    var c=document.getElementById("game");c.style.display="block";
    ForestMap.start(c);
  };
});
</script>
</body>
</html>
